<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11" />
      <stop offset="50%" stop-color="#0F1420" />
      <stop offset="100%" stop-color="#0A0D16" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161E2E" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0E131F" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowViolet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 64px;
      letter-spacing: -1.5px;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94A3B8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #E2E8F0;
    }
    .code-text {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 14px;
      fill: #38BDF8;
    }
    .lyric-primary {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 17px;
      fill: #F8FAFC;
    }
    .lyric-secondary {
      font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
      font-weight: 500;
      font-size: 15px;
      fill: #38BDF8;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1280" height="460" rx="20" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- Background Ambient Lights / Blobs -->
  <circle cx="200" cy="120" r="160" fill="#8B5CF6" opacity="0.16" filter="url(#glowViolet)" />
  <circle cx="1080" cy="240" r="180" fill="#06B6D4" opacity="0.14" filter="url(#glowCyan)" />
  <circle cx="640" cy="380" r="140" fill="#EC4899" opacity="0.08" filter="url(#glowViolet)" />

  <!-- Subtle Grid lines -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="160" y1="0" x2="160" y2="460" />
    <line x1="320" y1="0" x2="320" y2="460" />
    <line x1="480" y1="0" x2="480" y2="460" />
    <line x1="640" y1="0" x2="640" y2="460" />
    <line x1="800" y1="0" x2="800" y2="460" />
    <line x1="960" y1="0" x2="960" y2="460" />
    <line x1="1120" y1="0" x2="1120" y2="460" />
  </g>

  <!-- Left Side: Branding, Title & Badges -->
  <g transform="translate(80, 80)">
    <!-- App Logo Icon -->
    <g transform="translate(0, 5)">
      <rect width="70" height="70" rx="20" fill="url(#primaryGrad)" filter="url(#subtleGlow)" />
      <!-- Music Note & Speech Bubble -->
      <path d="M22,30a3,3 0,0 1,3 -3h20a3,3 0,0 1,3 3v12a3,3 0,0 1,-3 3h-12l-6,6v-6h-2a3,3 0,0 1,-3 -3z" fill="#080B11" opacity="0.4" />
      <path d="M40,20v16.2a5.5,5.5 0,1 1,-3.5 -1.6v-10.6l11,-3v6.5z" fill="#FFFFFF" />
    </g>

    <!-- Main Title -->
    <text x="90" y="55" class="title-text" fill="url(#primaryGrad)">LyricEcho AI</text>
    
    <!-- Tagline -->
    <text x="0" y="125" class="tagline-text">Real-Time Bilingual Lyrics &amp; Synchronized Floating Overlay Player</text>
    <text x="0" y="155" class="tagline-text" fill="#64748B">Powered by Gemini AI, DeepSeek &amp; LRCLIB • Built for Android with Jetpack Compose</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 195)">
      <!-- Pill 1: Floating Overlay -->
      <rect x="0" y="0" width="168" height="34" rx="17" fill="#1E293B" stroke="#06B6D4" stroke-width="1.2" />
      <circle cx="16" cy="17" r="5" fill="#06B6D4" />
      <text x="30" y="22" class="badge-text">Floating Overlay</text>

      <!-- Pill 2: Spotify Sync -->
      <rect x="180" y="0" width="150" height="34" rx="17" fill="#1E293B" stroke="#10B981" stroke-width="1.2" />
      <circle cx="196" cy="17" r="5" fill="#10B981" />
      <text x="210" y="22" class="badge-text">Spotify Sync</text>

      <!-- Pill 3: Dual AI Translation -->
      <rect x="342" y="0" width="165" height="34" rx="17" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.2" />
      <circle cx="358" cy="17" r="5" fill="#8B5CF6" />
      <text x="372" y="22" class="badge-text">AI Dual-Lyrics</text>

      <!-- Pill 4: Offline Room Cache -->
      <rect x="519" y="0" width="145" height="34" rx="17" fill="#1E293B" stroke="#EC4899" stroke-width="1.2" />
      <circle cx="535" cy="17" r="5" fill="#EC4899" />
      <text x="548" y="22" class="badge-text">Room Cache</text>
    </g>

    <!-- Live Audio Equalizer Bars -->
    <g transform="translate(0, 260)" fill="#06B6D4">
      <rect x="0" y="8" width="4" height="24" rx="2" fill="#06B6D4" />
      <rect x="8" y="2" width="4" height="30" rx="2" fill="#38BDF8" />
      <rect x="16" y="14" width="4" height="18" rx="2" fill="#818CF8" />
      <rect x="24" y="0" width="4" height="32" rx="2" fill="#8B5CF6" />
      <rect x="32" y="6" width="4" height="26" rx="2" fill="#A855F7" />
      <rect x="40" y="18" width="4" height="14" rx="2" fill="#C084FC" />
      <rect x="48" y="10" width="4" height="22" rx="2" fill="#EC4899" />
      <text x="66" y="22" class="code-text" fill="#94A3B8">Live Synced Playback &amp; Real-Time AI Inference</text>
    </g>
  </g>

  <!-- Right Side: Mini Floating Window Mockup Preview -->
  <g transform="translate(790, 65)">
    <!-- Glow behind card -->
    <rect x="-10" y="-10" width="430" height="330" rx="28" fill="#8B5CF6" opacity="0.12" filter="url(#glowViolet)" />

    <!-- Card Window -->
    <rect width="410" height="310" rx="22" fill="url(#cardGrad)" stroke="#06B6D4" stroke-width="1.8" filter="url(#subtleGlow)" />

    <!-- Window Header -->
    <g transform="translate(20, 20)">
      <circle cx="16" cy="16" r="16" fill="url(#violetGrad)" />
      <!-- Music Icon inside circle -->
      <path d="M19,10v10a3,3 0,1 1,-2 -1v-6l6,-1.8v4z" fill="#FFFFFF" />

      <!-- Song Title & Artist -->
      <text x="42" y="14" font-family="-apple-system, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">Neon Echoes</text>
      <text x="42" y="27" font-family="-apple-system, sans-serif" font-weight="500" font-size="12" fill="#94A3B8">Nova • Persian</text>

      <!-- Action Buttons (Sync, Min, Expand, Close) -->
      <circle cx="280" cy="16" r="8" fill="#1E293B" />
      <circle cx="310" cy="16" r="8" fill="#1E293B" />
      <circle cx="340" cy="16" r="8" fill="#1E293B" />
      <circle cx="365" cy="16" r="8" fill="#EF4444" opacity="0.8" />
    </g>

    <!-- Progress Line -->
    <g transform="translate(20, 70)">
      <text x="0" y="8" font-family="monospace" font-size="11" fill="#06B6D4">● 01:24</text>
      <text x="160" y="8" font-family="monospace" font-size="11" fill="#64748B">03:45</text>
      <text x="325" y="8" font-family="monospace" font-size="11" fill="#94A3B8">-02:21</text>
      <!-- Bar Track -->
      <rect x="0" y="16" width="370" height="4" rx="2" fill="#1E293B" />
      <rect x="0" y="16" width="130" height="4" rx="2" fill="url(#cyanGrad)" />
    </g>

    <!-- Lyrics Box Inner -->
    <g transform="translate(20, 110)">
      <rect width="370" height="120" rx="14" fill="#0A0E17" fill-opacity="0.8" stroke="#1E293B" stroke-width="1" />
      
      <!-- Inactive previous line -->
      <text x="185" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#475569">Echoes fading into the starlit sky</text>

      <!-- Active Lyric Line (English) -->
      <text x="185" y="60" text-anchor="middle" class="lyric-primary">Lighting up the rhythm of the night</text>
      
      <!-- Active Translated Line (Persian) -->
      <text x="185" y="86" text-anchor="middle" class="lyric-secondary">روشن کردن ریتم و ضرب‌آهنگ شب</text>

      <!-- Inactive next line -->
      <text x="185" y="108" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#475569">A melody that never fades away</text>
    </g>

    <!-- Controls Bottom -->
    <g transform="translate(20, 250)">
      <!-- Prev -->
      <polygon points="20,18 30,12 30,24" fill="#94A3B8" />
      <polygon points="10,18 20,12 20,24" fill="#94A3B8" />

      <!-- Pause -->
      <rect x="44" y="10" width="4" height="16" rx="2" fill="#06B6D4" />
      <rect x="52" y="10" width="4" height="16" rx="2" fill="#06B6D4" />

      <!-- Next -->
      <polygon points="70,12 80,18 70,24" fill="#94A3B8" />
      <polygon points="80,12 90,18 80,24" fill="#94A3B8" />

      <!-- Sync Buttons -->
      <text x="210" y="22" font-family="-apple-system, sans-serif" font-size="12" fill="#94A3B8">0.0s سینک</text>
      <rect x="270" y="8" width="42" height="22" rx="6" fill="#1E293B" stroke="#06B6D4" stroke-width="0.8" />
      <text x="291" y="23" text-anchor="middle" font-family="monospace" font-size="11" fill="#38BDF8">-0.5s</text>

      <rect x="320" y="8" width="42" height="22" rx="6" fill="#1E293B" stroke="#06B6D4" stroke-width="0.8" />
      <text x="341" y="23" text-anchor="middle" font-family="monospace" font-size="11" fill="#38BDF8">+0.5s</text>
    </g>
  </g>
</svg>
